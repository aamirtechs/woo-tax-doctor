[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "woo-tax-doctor"
version = "1.0.0"
description = "Audit a WooCommerce tax rates CSV export"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
woo-tax-doctor = "woo_tax_doctor:main_entry"

[tool.setuptools]
py-modules = ["woo_tax_doctor"]
